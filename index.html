<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17130F">
  <title>MEHFIL — 90s Ghazal Radio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Tiro+Devanagari+Hindi&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg-scene" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-left">
      <span class="clock" id="clock">--:--</span>
    </div>

    <div class="topbar-center">MEHFIL</div>

    <div class="topbar-right">
      <span class="listeners"><span class="live-dot"></span><span id="listeners">1,248</span> LISTENING</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">A 90s Ghazal Radio</p>
        <h1>मेहफ़िल</h1>
        <p class="hero-tags">90s Hindi · Ghazal · Ishq · Shaam</p>
        <p class="hero-poetic">“Thodi si raat, thoda sa ishq, aur ek gaana.”</p>
      </div>
    </section>
  </main>

  <!-- YouTube player is intentionally tiny/hidden.
       Audio is controlled through the YouTube IFrame Player API. -->
  <div id="youtube-player" class="youtube-player" aria-hidden="true"></div>

  <div class="player-wrap">
    <!-- DESKTOP PLAYER -->
    <div class="player desktop-player">
      <div class="vinyl-wrap">
        <div class="vinyl" id="vinyl">
          <div class="vinyl-groove groove-1"></div>
          <div class="vinyl-groove groove-2"></div>
          <div class="vinyl-groove groove-3"></div>
          <div class="vinyl-label">
            <span>मेहफ़िल</span>
            <small>MEHFIL</small>
          </div>
          <div class="spindle"></div>
        </div>
      </div>

      <div class="track-info">
        <div class="track-title" id="songTitle">MEHFIL RADIO</div>
        <div class="track-artist" id="artist">90s Ghazal Collection</div>

        <div class="seek-row">
          <div class="seek-hit" id="progress" role="slider" aria-label="Seek">
            <div class="seek-rail">
              <div class="seek-fill" id="progressFill"></div>
              <div class="seek-knob" id="progressKnob"></div>
            </div>
          </div>
          <span class="time" id="currentTime">00:00</span>
          <span class="time">/</span>
          <span class="time" id="duration">00:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="control" id="prevButton" aria-label="Previous track">◀</button>
        <button class="control play" id="playButton" aria-label="Play">▶</button>
        <button class="control" id="nextButton" aria-label="Next track">▶</button>
      </div>
    </div>

    <!-- MOBILE PLAYER -->
    <div class="player mobile-player">
      <div class="mobile-main">
        <div class="vinyl-wrap small">
          <div class="vinyl" id="mobileVinyl">
            <div class="vinyl-groove groove-1"></div>
            <div class="vinyl-groove groove-2"></div>
            <div class="vinyl-groove groove-3"></div>
            <div class="vinyl-label"><span>मेहफ़िल</span></div>
            <div class="spindle"></div>
          </div>
        </div>

        <div class="mobile-info">
          <div class="track-title" id="mobileTitle">MEHFIL RADIO</div>
          <div class="track-artist" id="mobileArtist">90s Ghazal Collection</div>
        </div>

        <button class="control play" id="mobilePlayButton" aria-label="Play">▶</button>
      </div>

      <div class="mobile-seek">
        <div class="seek-hit" id="mobileProgress" role="slider" aria-label="Seek">
          <div class="seek-rail">
            <div class="seek-fill" id="mobileProgressFill"></div>
            <div class="seek-knob" id="mobileProgressKnob"></div>
          </div>
        </div>
        <div class="mobile-time">
          <span id="mobileCurrentTime">00:00</span>
          <span id="mobileDuration">00:00</span>
        </div>
      </div>

      <div class="mobile-controls">
        <button class="control" id="mobilePrevButton" aria-label="Previous track">◀</button>
        <button class="control" id="mobileNextButton" aria-label="Next track">▶</button>
      </div>
    </div>
  </div>

  <div class="creator-credit">CRAFTED BY PIXELPERFECTIN</div>

  <script src="script.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
