<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17130F">

  <title>MEHFIL — 90s Ghazal Radio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Tiro+Devanagari+Hindi&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- Main CSS -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <div class="bg-scene" aria-hidden="true"></div>

  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="vignette" aria-hidden="true"></div>

  <div class="grain" aria-hidden="true"></div>


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="topbar">

    <!-- Clock -->
    <div class="topbar-left">

      <span
        id="clock"
        class="clock"
      >
        --:--
      </span>

    </div>


    <!-- Logo -->
    <div class="topbar-center">
      MEHFIL
    </div>


    <!-- Listener count -->
    <div class="topbar-right">

      <div class="listeners">

        <span class="live-dot"></span>

        <span id="listeners">
          1,248
        </span>

        <span>
          LISTENING
        </span>

      </div>

    </div>

  </header>


  <!-- =====================================================
       HERO
  ====================================================== -->

  <main>

    <section class="hero">

      <div class="hero-content">

        <p class="eyebrow">
          A 90s Ghazal Radio
        </p>


        <h1>
          मेहफ़िल
        </h1>


        <p class="hero-tags">
          90s Hindi · Ghazal · Ishq · Shaam
        </p>


        <p class="hero-poetic">
          “Thodi si raat, thoda sa ishq, aur ek gaana.”
        </p>

      </div>

    </section>

  </main>


  <!-- =====================================================
       YOUTUBE PLAYER

       IMPORTANT:
       This element must exist before the YouTube API
       tries to create the player.
  ====================================================== -->

  <div
    id="youtube-player"
    class="youtube-player"
    aria-label="YouTube music player"
  ></div>


  <!-- =====================================================
       DESKTOP PLAYER
  ====================================================== -->

  <section
    class="player-wrap"
    aria-label="MEHFIL music player"
  >

    <div
      class="player desktop-player"
    >

      <!-- Vinyl -->
      <div class="vinyl-wrap">

        <div
          id="vinyl"
          class="vinyl"
        >

          <div class="vinyl-groove groove-1"></div>

          <div class="vinyl-groove groove-2"></div>

          <div class="vinyl-groove groove-3"></div>


          <div class="vinyl-label">

            <span>
              मेहफ़िल
            </span>

            <small>
              MEHFIL
            </small>

          </div>


          <div class="spindle"></div>

        </div>

      </div>


      <!-- Track information -->
      <div class="track-info">

        <div
          id="songTitle"
          class="track-title"
        >
          MEHFIL RADIO
        </div>


        <div
          id="artist"
          class="track-artist"
        >
          90s Ghazal Collection
        </div>


        <!-- Seek -->
        <div class="seek-row">

          <div
            id="progress"
            class="seek-hit"
            role="slider"
            aria-label="Seek track"
            tabindex="0"
          >

            <div class="seek-rail">

              <div
                id="progressFill"
                class="seek-fill"
              ></div>

              <div
                id="progressKnob"
                class="seek-knob"
              ></div>

            </div>

          </div>


          <span
            id="currentTime"
            class="time"
          >
            00:00
          </span>

          <span class="time">
            /
          </span>

          <span
            id="duration"
            class="time"
          >
            00:00
          </span>

        </div>

      </div>


      <!-- Desktop controls -->
      <div class="controls">

        <button
          id="prevButton"
          class="control"
          type="button"
          aria-label="Previous track"
        >
          ◀
        </button>


        <button
          id="playButton"
          class="control play"
          type="button"
          aria-label="Play"
        >
          ▶
        </button>


        <button
          id="nextButton"
          class="control"
          type="button"
          aria-label="Next track"
        >
          ▶
        </button>

      </div>

    </div>


    <!-- ===================================================
         MOBILE PLAYER
    ==================================================== -->

    <div
      class="player mobile-player"
    >

      <div class="mobile-main">

        <!-- Mobile vinyl -->
        <div class="vinyl-wrap small">

          <div
            id="mobileVinyl"
            class="vinyl"
          >

            <div class="vinyl-groove groove-1"></div>

            <div class="vinyl-groove groove-2"></div>

            <div class="vinyl-groove groove-3"></div>


            <div class="vinyl-label">

              <span>
                मेहफ़िल
              </span>

            </div>


            <div class="spindle"></div>

          </div>

        </div>


        <!-- Mobile track info -->
        <div class="mobile-info">

          <div
            id="mobileTitle"
            class="track-title"
          >
            MEHFIL RADIO
          </div>


          <div
            id="mobileArtist"
            class="track-artist"
          >
            90s Ghazal Collection
          </div>

        </div>


        <!-- Mobile play -->
        <button
          id="mobilePlayButton"
          class="control play"
          type="button"
          aria-label="Play"
        >
          ▶
        </button>

      </div>


      <!-- Mobile progress -->
      <div class="mobile-seek">

        <div
          id="mobileProgress"
          class="seek-hit"
          role="slider"
          aria-label="Seek track"
          tabindex="0"
        >

          <div class="seek-rail">

            <div
              id="mobileProgressFill"
              class="seek-fill"
            ></div>

            <div
              id="mobileProgressKnob"
              class="seek-knob"
            ></div>

          </div>

        </div>


        <div class="mobile-time">

          <span id="mobileCurrentTime">
            00:00
          </span>

          <span id="mobileDuration">
            00:00
          </span>

        </div>

      </div>


      <!-- Mobile controls -->
      <div class="mobile-controls">

        <button
          id="mobilePrevButton"
          class="control"
          type="button"
          aria-label="Previous track"
        >
          ◀
        </button>


        <button
          id="mobileNextButton"
          class="control"
          type="button"
          aria-label="Next track"
        >
          ▶
        </button>

      </div>

    </div>

  </section>


  <!-- =====================================================
       FOOTER CREDIT
  ====================================================== -->

  <div class="creator-credit">
    CRAFTED BY PIXELPERFECTIN
  </div>


  <!-- =====================================================
       JAVASCRIPT

       IMPORTANT ORDER:
       1. script.js
       2. YouTube API

       script.js defines window.onYouTubeIframeAPIReady
       before YouTube calls it.
  ====================================================== -->

  <script src="./script.js"></script>

  <script
    src="https://www.youtube.com/iframe_api"
  ></script>

</body>
</html>
